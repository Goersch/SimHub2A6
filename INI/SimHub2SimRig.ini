; Central settings for SimHub2A6. Times are in seconds unless explicitly
; marked with _ms. Axes are specified as 1..10.

[modbus]
connection_count = 3
baud = 115200
serial_timeout_s = 0.2
inter_frame_delay_s = 0.00175
response_poll_delay_s = 0.001
queue_drain_timeout_s = 10.0
task_wait_timeout_s = 10.0
worker_join_timeout_s = 2.0

[modbus_connection_1]
port = COM9
axes = 1, 2, 3

[modbus_connection_2]
port = COM6
axes = 5, 7

[modbus_connection_3]
port = COM7
axes = 4, 6

[rig]
maximum_axes = 7
; Geometry of the four lift motors, all values in mm
DistanceFrontDrivesLeft2Right = 990
DistanceRearDrivesLeft2Right = 990
DistanceFront2RearDrives = 1660
; Center of gravity relative to the geometric rig center: positive forward/right
CenterOfGravityFront2Rear = 0
CenterOfGravityLeft2Right = 0
; Lowest position of the driver's buttocks above the floor
CenterOfGravityHeight = 900

[motion_limits]
minimum_mm = -100.0
maximum_mm = 100.0
homing_mm = -100.0
reference_spindle_pitch_mm = 10.0
reference_app_units_per_mm = 1000
raw_position_max = 131071

[axis_1]
enabled = yes
spindle_pitch_mm = 10.0
stroke_mm = 200.0
zero_offset_mm = 0.0
speed_mm_s  = 300.0
accTime = 400
decTime = 400

[axis_2]
enabled = yes
spindle_pitch_mm = 10.0
stroke_mm = 200.0
zero_offset_mm = 0.0
speed_mm_s = 200.0
accTime = 400
decTime = 400

[axis_3]
enabled = yes
spindle_pitch_mm = 10.0
stroke_mm = 200.0
zero_offset_mm = 0.0
speed_mm_s = 300.0
accTime = 400
decTime = 400

[axes_4_7]
axes = 4, 5, 6, 7
enabled = yes
spindle_pitch_mm = 5.0
stroke_mm = 200.0
zero_offset_mm = 70.0
speed_mm_s = 150.0
accTime = 400
decTime = 400

[a6]
poll_interval_s = 0.2
homing_start_observation_s = 3.0
operation_timeout_s = 30.0
invert_digital_inputs = yes
homing_initial_rpm = 100
homing_end_rpm = 10
homing_accel_ms = 200
homing_decel_ms = 200
planner_start_rpm = 200
planner_start_accel_ms = 300
planner_start_decel_ms = 300
move_rpm = 100
move_accel_ms = 500
move_decel_ms = 500

[simhub]
udp_ip = 127.0.0.1
udp_port = 9999
disconnect_timeout_s = 3.0
sender_cycle_s = 0.01
position_count = 7
position_min = 0
position_max = 131071
data_retention_days = 14

[control]
hub_axis_from = 4
hub_axis_to = 7
hub_status_poll_interval_s = 0.5
; One axis per interval; pure waiting time per cycle: 7 * interval.
; Modbus read times are added on top of this.
actual_position_poll_interval_s = 0.05
dynamic_accel_step_ms = 25
dynamic_parameter_update_interval_s = 0.25
center_rpm = 100
center_accel_ms = 200
center_decel_ms = 200
maintenance_middle_rpm = 100
maintenance_hub_rpm = 75
axis_wait_timeout_s = 30.0
homing_wait_timeout_s = 60.0
wait_poll_interval_s = 0.05

[leveling]
load_rate_units_per_percent = 10.0
load_bias_by_axis = 4:4.0
load_rate_samples = 11
load_rate_sample_delay_s = 0.06
settle_time_s = 2.0
settle_checks = 2
settle_check_delay_s = 0.4
settle_load_delta = 12.0
verify_batches = 5
verify_corrections = 3
minimum_tolerance = 10.0
offset_axes = 4, 5, 6, 7

[leveling_stage_coarse]
step_mm = 0.2
max_iterations = 35
target_tolerance = 2.0
kp = 0.0022
allow_lowering = no
filter_alpha = 0.25
lower_step_factor = 0.25
raw_weight = 0.30
integral_gain = 0.0

[leveling_stage_medium]
step_mm = 0.08
max_iterations = 24
target_tolerance = 1.2
kp = 0.0010
allow_lowering = yes
filter_alpha = 0.18
lower_step_factor = 0.25
raw_weight = 0.25
integral_gain = 0.04

[leveling_stage_fine]
step_mm = 0.04
max_iterations = 14
target_tolerance = 1.0
kp = 0.00035
allow_lowering = yes
filter_alpha = 0.18
lower_step_factor = 0.20
raw_weight = 0.20
integral_gain = 0.0

[grease]
rpm = 100
accel_ms = 500
decel_ms = 500
negative_mm = -100.0
positive_mm = 100.0
center_mm = 0.0
move_timeout_s = 30.0
position_poll_interval_s = 0.05
warning_after_operating_hours = 80.0
alarm_after_operating_hours = 100.0

[ui]
refresh_ms = 100
# Interval in which the status of each displayed axis is read once.
axis_status_refresh_ms = 1000
trigger_chart_refresh_ms = 1000
trigger_chart_window_s = 60.0
trigger_chart_max_ms = 200.0
disconnected_background = #FFF5E5
connected_background = #000000
