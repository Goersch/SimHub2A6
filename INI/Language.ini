; Editable presentation rules for Com activity, log and error messages.
; Named regex captures are data; action/error/message/stage/result are translated recursively.
; Keep the pattern/text keys paired. Unknown device/OS messages remain raw.
[MessagePatterns]
exception = ^(?<type>(?:System|SimHub2SimRig)[\w.]+): (?<error>.+)$
leveling = ^\[LEVELING\] (?<message>.+)$
port_error_details = ^COM Error \((?<port>[^)]+)\) - I try again in 10 seconds: (?<error>.+)$
port_error = ^COM Error \((?<port>[^)]+)\) - I try again in 10 seconds$
port_retry = ^Retrying COM port (?<port>.+)$
port_opened = ^COM port (?<port>.+) opened successfully$
job_stopped = ^(?<action>Initialization|Center|Maintenance preparation|Restore planners|Homing|Maintenance movement|Greasing|Leveling|Load measurement|Finish analysis|Center after playback) stopped$
telemetry = ^Telemetry axis (?<axis>\d+): (?<error>.+)$
grease_data = ^Grease data: (?<error>.+)$
calibration_ignored = ^Load calibration ignored: (?<error>.+)$
logging_error = ^Logging: (?<error>.+)$
shutdown_error = ^SHUTDOWN_ERROR (?<error>.+)$
recording_started = ^Recording (?<file>.+\.csv)$
worker_pid = ^Communication worker PID: (?<pid>\d+)$
axis_restart = ^Axis (?<axis>\d+): restart required; check ALF1\.0 and press SET$
axis_do5 = ^Axis (?<axis>\d+): DO5 function != 9$
modbus_write = ^Modbus write: missing/short reply on axis (?<axis>\d+)$
modbus_route = ^No Modbus route for axis (?<axis>\d+)$
modbus_exception = ^Modbus exception (?<code>0x[\dA-F]+) \(function (?<function>0x[\dA-F]+)\)$
drive_error = ^Drive-Error (?<code>.+)$
unknown_ipc = ^Unknown IPC operation: (?<operation>.+)$
unknown_udp = ^Unknown UDP command: (?<command>.+)$
duplicate_section = ^Duplicate INI section: (?<section>.+)$
duplicate_key = ^Duplicate INI key: (?<key>.+)$
invalid_ini = ^Invalid INI line: (?<line>.+)$
invalid_boolean = ^Invalid boolean: (?<value>.+)$
finite_value = ^(?<setting>[\w.]+) must be finite$
positive_value = ^Must be positive: (?<setting>.+)$
nonnegative_value = ^Must be nonnegative: (?<setting>.+)$
invalid_a6_init = ^Invalid A6 initialization parameter: (?<setting>a6_init\.[\w]+)$
invalid_axis = ^Invalid axis parameters: (?<axis>\d+)$
missing_axis = ^Missing axis (?<axis>\d+)$
missing_ini = ^INI/(?<file>.+) not found; pass --root <directory>$
offsets_load = ^Offsets could not be loaded: (?<error>.+)$
fixed_axis = ^Fixed axis: (?<axis>\d+)$
leveling_verification = ^Verify (?<result>OK|WARNING|UNSTABLE), score=(?<score>[^,]+), range=(?<range>[^,]+), loads=\[(?<loads>[^]]*)\]$
