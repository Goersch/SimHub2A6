; SimHub2SimRigCom settings. Times are in seconds unless marked with _ms.
; Display settings are in SimHub2SimRigHMI.ini. Axes are specified as 1..7.

[modbus]
connection_count = 2
baud = 115200
serial_timeout_s = 0.2
inter_frame_delay_s = 0.00175
response_poll_delay_s = 0.001
queue_drain_timeout_s = 10.0
task_wait_timeout_s = 10.0
worker_join_timeout_s = 2.0

;[modbus_connection_1]
;port = COM9
;axes = 1, 2, 3

[modbus_connection_1]
port = COM7
axes = 4, 6

[modbus_connection_2]
port = COM6
axes = 5, 7

[rig]
maximum_axes = 7
; Geometry of the four lift motors, all values in mm
DistanceFrontDrivesLeft2Right = 990
DistanceRearDrivesLeft2Right = 990
DistanceFront2RearDrives = 1660
; Center of gravity relative to the geometric rig center: positive forward/right
CenterOfGravityFront2Rear = 0
CenterOfGravityLeft2Right = 0
; Lowest position of the driver's buttocks above the floor
CenterOfGravityHeight = 900

[motion_limits]
; INIT: C0E.03 (0x0E03), lower software travel limit in mm.
minimum_mm = -100.0
; INIT: C0E.00 (0x0E00), upper software travel limit in mm.
maximum_mm = 100.0
; INIT and homing: C10.0B (0x100B), homing offset in mm.
; These three values are converted to application units per axis using spindle pitch.
homing_mm = -100.0
reference_spindle_pitch_mm = 10.0
reference_app_units_per_mm = 1000
raw_position_max = 131071

[axis_1]
enabled = no
spindle_pitch_mm = 10.0
stroke_mm = 200.0
zero_offset_mm = 0.0
speed_mm_s  = 300.0
accTime = 400
decTime = 400

[axis_2]
enabled = no
spindle_pitch_mm = 10.0
stroke_mm = 200.0
zero_offset_mm = 0.0
speed_mm_s = 200.0
accTime = 400
decTime = 400

[axis_3]
enabled = no
spindle_pitch_mm = 10.0
stroke_mm = 200.0
zero_offset_mm = 0.0
speed_mm_s = 300.0
accTime = 400
decTime = 400

[axes_4_7]
axes = 4, 5, 6, 7
enabled = yes
spindle_pitch_mm = 5.0
stroke_mm = 200.0
zero_offset_mm = 70.0
speed_mm_s = 150.0
accTime = 400
decTime = 400

[a6]
poll_interval_s = 0.2
homing_start_observation_s = 3.0
operation_timeout_s = 30.0
invert_digital_inputs = yes
homing_initial_rpm = 100
homing_end_rpm = 10
; Active homing overrides the INIT values c10_04/c10_06 in [a6_init].
homing_accel_ms = 200
homing_decel_ms = 200
planner_start_rpm = 200
planner_start_accel_ms = 300
planner_start_decel_ms = 300
move_rpm = 100
move_accel_ms = 500
move_decel_ms = 500

[a6_init]
; Drive parameters for INIT; apply to every enabled axis unless grouped below.
; Key cXX_YY = A6 parameter CXX.YY, Modbus address 0xXXYY.
; Values are decimal; axis-group settings are defined below.
; Register definitions: A6-RS manual, chapter 8 (parameter list).
; https://www.omc-stepperonline.com/download/A6-RS_series_servo_drive_manual.pdf
; All parameters are written on every INIT. Save persistently (C0A.05 = 1)
; only if C04.01 BEFORE INIT differs from the configured c04_01 value.
; This does not compare all parameters. Otherwise, C0A.05 = 0 is written.
; Persistent saving is followed by the existing restart/ALF1.0/SET message.
; S-ON off (C04.11 = 0) and save commands remain fixed sequence commands.
; Travel limits and homing offset are defined in [motion_limits]; see above.

; C00.06 (0x0006), U16: load inertia ratio in percent (0..12000).
; Written exactly as configured on every INIT: axes 1..3 = 1, axes 4..7 = 2.
c00_06_axes_1_3 = 1
c00_06_axes_4_7 = 2
; C00.22, U16: pulse input channel; 0 = standard, 1 = high speed.
c00_22 = 1
; C01.13 (0x0113), U16: speed feedforward source (0..4); 1 = internal reference.
; Applied only to axes 4..7; INIT leaves this parameter unchanged on axes 1..3.
c01_13_axes_4_7 = 1
; C01.14 (0x0114), U16: speed feedforward percentage in 0.1 % (0..2000).
; Applied only to axes 4..7; register value 100 = 10 %, 2000 = 200 %.
c01_14_axes_4_7 = 100
; C03.02/C03.04, U32: electronic gear numerator/denominator.
; Positive integers up to 2147483647 (COM integer range).
c03_02 = 131072
c03_04 = 131072
; C04.01/C04.05, U16: DI1/DI2 logic; 0 = NO, 1 = NC.
c04_01 = 1
c04_05 = 1
; C04.08, U16: DI3 function; 0 = unassigned.
c04_08 = 0
; C04.12, U16: DI5 filter time in 0.01 ms; 1 = 0.01 ms.
c04_12 = 1
; C04.14, U16: DI6 function; 19 = position planning trigger.
c04_14 = 19
; C04.18, U16: DI7 function; 25 = homing start enable.
c04_18 = 25
; C04.1C, U16: DI8 function; 0 = unassigned.
c04_1c = 0
; C05.0A, U32: slow-stop deceleration time in ms (0..3600000).
c05_0a = 10
; C05.0C, U16: emergency-stop torque limit in 0.1 % (5..3000); 10 = 1 %.
c05_0c = 10
; C10.00, U16: homing enable; 2 = DI trigger. Also used by StartHoming.
c10_00 = 2
; C10.01, I16: homing method (-2..35); previous mode 17.
c10_01 = 17
; C10.04/C10.06, U32: INIT acceleration/deceleration time in ms (0..3600000).
; StartHoming then uses [a6].homing_accel_ms/homing_decel_ms.
c10_04 = 100
c10_06 = 100
; Delays in seconds (>= 0): before writing parameters, before saving,
; and after the save command. The last two apply only to persistent saving.
parameter_delay_s = 0.2
save_delay_s = 0.2
restart_delay_s = 2.0

[simhub]
udp_ip = 127.0.0.1
udp_port = 9999
disconnect_timeout_s = 3.0
sender_cycle_s = 0.01
position_count = 7
position_min = 0
position_max = 131071
data_retention_days = 14

[simulation]
; Interval of the A6 simulation and CSV recording in seconds.
; 0.01 equals 10 ms, or approximately 100 records per second.
; Smaller values improve time resolution but create larger CSV files.
simulation_interval_s = 0.025

[control]
; Interval in which Com reads the status of every axis once.
axis_status_refresh_ms = 1000
hub_axis_from = 4
hub_axis_to = 7
hub_status_poll_interval_s = 0.5
; One axis per interval; pure waiting time per cycle: 7 * interval.
; Modbus read times are added on top of this.
actual_position_poll_interval_s = 0.05
dynamic_accel_step_ms = 25
dynamic_parameter_update_interval_s = 0.25
center_rpm = 100
center_accel_ms = 200
center_decel_ms = 200
maintenance_middle_rpm = 100
maintenance_hub_rpm = 75
axis_wait_timeout_s = 30.0
homing_wait_timeout_s = 60.0
wait_poll_interval_s = 0.05

[leveling]
load_rate_units_per_percent = 10.0
load_bias_by_axis = 4:4.0
load_rate_samples = 11
load_rate_sample_delay_s = 0.06
settle_time_s = 2.0
settle_checks = 2
settle_check_delay_s = 0.4
settle_load_delta = 12.0
verify_batches = 5
verify_corrections = 3
minimum_tolerance = 10.0
offset_axes = 4, 5, 6, 7

[leveling_stage_coarse]
step_mm = 0.2
max_iterations = 35
target_tolerance = 2.0
kp = 0.0022
allow_lowering = no
filter_alpha = 0.25
lower_step_factor = 0.25
raw_weight = 0.30
integral_gain = 0.0

[leveling_stage_medium]
step_mm = 0.08
max_iterations = 24
target_tolerance = 1.2
kp = 0.0010
allow_lowering = yes
filter_alpha = 0.18
lower_step_factor = 0.25
raw_weight = 0.25
integral_gain = 0.04

[leveling_stage_fine]
step_mm = 0.04
max_iterations = 14
target_tolerance = 1.0
kp = 0.00035
allow_lowering = yes
filter_alpha = 0.18
lower_step_factor = 0.20
raw_weight = 0.20
integral_gain = 0.0

[grease]
rpm = 100
accel_ms = 500
decel_ms = 500
negative_mm = -100.0
positive_mm = 100.0
center_mm = 0.0
move_timeout_s = 30.0
position_poll_interval_s = 0.05
warning_after_operating_hours = 80.0
alarm_after_operating_hours = 100.0
