; SimHub2SimRigHMI display settings. Times ending in _ms are milliseconds.
; Hardware, motion and telemetry settings are in SimHub2SimRigCom.ini.

[ui]
; Windows display device number: 1 = DISPLAY1, 2 = DISPLAY2, etc.
; Use the primary monitor if the selected display is not connected.
monitor = 2
refresh_ms = 100
trigger_chart_refresh_ms = 1000
trigger_chart_window_s = 60.0
trigger_chart_max_ms = 200.0
disconnected_background = #FFF5E5
connected_background = #000000

; Optional [room_light] settings can be added here. INI/room_light.ini,
; when present, overrides them and remains private to this installation.
